# coturn for Ravan — relay of last resort for participants whose network
# blocks direct UDP to the SFU.
#
# The static auth secret is shared with LiveKit and injected at container start
# by deploy/coturn/entrypoint.sh (see docker-compose.yml); this file carries no
# credentials.
listening-port=3478
tls-listening-port=5349

fingerprint
lt-cred-mech
use-auth-secret
realm=ravan

# Relay only to the public internet: never let a client use the TURN server to
# reach the server's own private network.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

min-port=50300
max-port=50500

no-cli
no-tlsv1
no-tlsv1_1
pidfile=/var/tmp/turnserver.pid
