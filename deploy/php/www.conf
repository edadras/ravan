; Ravan php-fpm pool. Sized for a single mid-size server (4–8 vCPU).
; Raise pm.max_children if `docker compose logs backend` reports the pool is full.
[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 40
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.max_requests = 500
pm.status_path = /fpm-status

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
