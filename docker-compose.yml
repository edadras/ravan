# ---------------------------------------------------------------------------
# Ravan — single-server production stack.
#
#   ./install.sh            generate .env, build, start, seed
#   docker compose up -d    thereafter
#
# For a development machine add the override:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Every secret comes from .env (created by install.sh). Nothing in this file
# carries a credential and no image bakes one in.
# ---------------------------------------------------------------------------

x-backend-image: &backend-image
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: ravan/backend:local
  restart: unless-stopped
  depends_on:
    mysql: {condition: service_healthy}
    redis: {condition: service_healthy}

x-backend-env: &backend-env
  APP_NAME: ${APP_NAME:-Ravan}
  APP_ENV: production
  APP_KEY: ${APP_KEY:?APP_KEY is required — run ./install.sh}
  APP_DEBUG: "false"
  APP_URL: https://${RAVAN_DOMAIN:?RAVAN_DOMAIN is required}
  APP_LOCALE: ${APP_LOCALE:-fa}
  APP_FALLBACK_LOCALE: en
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-warning}

  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: ${DB_DATABASE:-ravan}
  DB_USERNAME: ${DB_USERNAME:-ravan}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  SESSION_ENCRYPT: "true"

  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: ${REVERB_APP_ID:?REVERB_APP_ID is required}
  REVERB_APP_KEY: ${REVERB_APP_KEY:?REVERB_APP_KEY is required}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:?REVERB_APP_SECRET is required}
  REVERB_HOST: reverb
  REVERB_PORT: "8080"
  REVERB_SCHEME: http
  # What the browser connects to (through Caddy).
  VITE_REVERB_HOST: ${RAVAN_DOMAIN}
  VITE_REVERB_PORT: "443"
  VITE_REVERB_SCHEME: https

  RAVAN_ANALYSIS_URL: http://analysis:8100
  RAVAN_ANALYSIS_TOKEN: ${RAVAN_ANALYSIS_TOKEN:?RAVAN_ANALYSIS_TOKEN is required}
  RAVAN_ANALYSIS_PUBLIC_WS: wss://${RAVAN_DOMAIN}/analysis
  RAVAN_WEBHOOK_SECRET: ${RAVAN_WEBHOOK_SECRET:?RAVAN_WEBHOOK_SECRET is required}
  RAVAN_WEBHOOK_URL: http://backend:9000/api/webhooks/analysis/events
  RAVAN_ASR_URL: http://asr:8200
  RAVAN_ASR_TOKEN: ${RAVAN_ASR_TOKEN:?RAVAN_ASR_TOKEN is required}

  RAVAN_WEBRTC_PROVIDER: livekit
  RAVAN_WEBRTC_URL: wss://${RAVAN_DOMAIN}
  RAVAN_WEBRTC_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
  RAVAN_WEBRTC_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}

  RAVAN_CATALOG_PATH: /catalog/signal_catalog.json
  RAVAN_PAYMENT_GATEWAY: ${RAVAN_PAYMENT_GATEWAY:-sandbox}
  RAVAN_PLATFORM_FEE_RATIO: ${RAVAN_PLATFORM_FEE_RATIO:-0.15}
  ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
  ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-true}

  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_SCHEME: ${MAIL_SCHEME:-tls}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@localhost}
  MAIL_FROM_NAME: ${APP_NAME:-Ravan}

services:
  # ------------------------------------------------------------------ data
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL:-512M}
      --max-connections=200
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ravan}
      MYSQL_USER: ${DB_USERNAME:-ravan}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - mysql:/var/lib/mysql
      - ./deploy/mysql/backups:/backups
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------ app
  backend:
    <<: *backend-image
    environment:
      <<: *backend-env
      RAVAN_ROLE: backend
      RAVAN_SEED: ${RAVAN_SEED:-false}
    volumes:
      - storage:/app/storage/app
      - ./catalog:/catalog:ro

  worker:
    <<: *backend-image
    command: ["php", "artisan", "queue:work", "--queue=high,default", "--tries=3", "--max-time=3600", "--sleep=1"]
    environment:
      <<: *backend-env
      RAVAN_ROLE: worker
    volumes:
      - storage:/app/storage/app
      - ./catalog:/catalog:ro
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      backend: {condition: service_started}

  scheduler:
    <<: *backend-image
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *backend-env
      RAVAN_ROLE: scheduler
    volumes:
      - storage:/app/storage/app
      - ./catalog:/catalog:ro
    depends_on:
      mysql: {condition: service_healthy}
      backend: {condition: service_started}

  reverb:
    <<: *backend-image
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    environment:
      <<: *backend-env
      RAVAN_ROLE: reverb
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}

  analysis:
    build:
      context: .
      dockerfile: analysis-service/Dockerfile
    image: ravan/analysis:local
    restart: unless-stopped
    environment:
      RAVAN_ANALYSIS_TOKEN: ${RAVAN_ANALYSIS_TOKEN}
      RAVAN_WEBHOOK_SECRET: ${RAVAN_WEBHOOK_SECRET}
      RAVAN_SESSION_TTL_S: ${RAVAN_SESSION_TTL_S:-14400}
      RAVAN_LLM_PROVIDER: ${RAVAN_LLM_PROVIDER:-none}
      RAVAN_LLM_MODEL: ${RAVAN_LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RAVAN_LOG_LEVEL: ${LOG_LEVEL_SERVICES:-INFO}

  asr:
    build:
      context: .
      dockerfile: asr-service/Dockerfile
      args:
        INSTALL_FASTER_WHISPER: ${RAVAN_ASR_INSTALL_LOCAL:-true}
    image: ravan/asr:local
    restart: unless-stopped
    environment:
      RAVAN_ASR_TOKEN: ${RAVAN_ASR_TOKEN}
      RAVAN_ASR_BACKEND: ${RAVAN_ASR_BACKEND:-faster_whisper}
      RAVAN_ASR_MODEL: ${RAVAN_ASR_MODEL:-large-v3}
      RAVAN_ASR_COMPUTE_TYPE: ${RAVAN_ASR_COMPUTE_TYPE:-int8}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HF_HOME: /models
      RAVAN_LOG_LEVEL: ${LOG_LEVEL_SERVICES:-INFO}
    volumes:
      - asr_models:/models
  # ------------------------------------------------------------------ media
  livekit:
    image: livekit/livekit-server:v1.8
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      NODE_IP: ${RAVAN_PUBLIC_IP:-}
    volumes:
      - ./deploy/livekit/livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      redis: {condition: service_healthy}
    ports:
      - "7881:7881"
      - "50000-50200:50000-50200/udp"

  coturn:
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped
    entrypoint: ["/entrypoint.sh"]
    environment:
      TURN_SECRET: ${TURN_SECRET:?TURN_SECRET is required}
      TURN_REALM: ${RAVAN_DOMAIN}
      TURN_EXTERNAL_IP: ${RAVAN_PUBLIC_IP:-}
    volumes:
      - ./deploy/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./deploy/coturn/entrypoint.sh:/entrypoint.sh:ro
      - caddy_data:/caddy-data:ro
    network_mode: host

  # ------------------------------------------------------------------ edge
  web:
    build:
      context: .
      dockerfile: deploy/flutter.Dockerfile
      args:
        RAVAN_API_URL: /api
        RAVAN_WS_URL: wss://${RAVAN_DOMAIN}
        RAVAN_LIVEKIT_URL: wss://${RAVAN_DOMAIN}
    image: ravan/web:local
    restart: "no"
    volumes:
      - web:/out

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      RAVAN_DOMAIN: ${RAVAN_DOMAIN}
      RAVAN_TLS_EMAIL: ${RAVAN_TLS_EMAIL:-admin@localhost}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - web:/srv/web:ro
      - storage:/srv/storage:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend: {condition: service_started}
      web: {condition: service_completed_successfully}

volumes:
  mysql:
  redis:
  storage:
  asr_models:
  web:
  caddy_data:
  caddy_config:
