name: ravan_app
description: Ravan tele-mental-health web app (patient, clinician, admin).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^14.2.0
  http: ^1.2.1
  web_socket_channel: ^3.0.1
  livekit_client: ^2.2.0
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
